server.port=9090

# Configuração CORS para desenvolvimento
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Configuração Base de Dados Local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/paroquiaperto
spring.datasource.username=postgres
spring.datasource.password=postgres

# Dialeto e driver
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Criação automática das tabelas
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL no console para debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações adicionais para desenvolvimento
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
